[package]
name = "vibevisor"
version = "1.0.0"
description = "A lightweight desktop app for running Linux ARM64 VMs on Apple Silicon, built with Rust, Tauri, and QEMU."
authors = ["pallab-js"]
edition = "2021"

[lib]
name = "vibevisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
dirs = "6"
ring = "0.17"
base64 = "0.22"
tempfile = "3"
flate2 = "1"
tar = "0.4"
nanoid = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"

[dev-dependencies]
tempfile = "3"
